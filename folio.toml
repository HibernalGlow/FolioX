# Folio-OCR configuration file
# Place in project root or set FOLIO_CONFIG env var to override path

[batch]
# Blacklist keywords: folders whose name contains any of these keywords will be skipped
# Useful for skipping image-only galleries that have no text to OCR
blacklist = ["画集","[03gen]"]

# Default file extensions to process
ext = [".zip", ".rar", ".7z", ".tar", ".gz", ".pdf"]

# Also process standalone image files
include_images = false

# Skip layout detection (faster, recommended for batch)
no_layout = true

# Maximum concurrent OCR tasks
concurrency = 1

# Incremental mode by default
incremental = true

# OCR backend: "ollama" or "umiocr"
backend = "umiocr"

[umiocr]
# UmiOCR HTTP service address
base = "http://127.0.0.1:1224"
                                        