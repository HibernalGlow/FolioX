[project]
name = "folio-ocr"
version = "3.2.0"
description = "三栏文档 OCR 工作台 - 基于 GLM-OCR + Ollama 的桌面应用"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "python-multipart",
    "httpx>=0.25.0",
    "pymupdf>=1.23.0",
    "Pillow>=10.0.0",
    "pillow-jxl-plugin>=1.3.0",
    "transformers>=4.40.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "python-docx>=1.1.0",
    "pywebview>=5.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.scripts]
folio = "app.cli.app:cli"

[project.optional-dependencies]
pack = [
    "pyinstaller>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build]
exclude = [
    ".venv",
    "frontend/node_modules",
    "frontend/dist",
    "uploads",
    "*.db",
    "__pycache__",
    "docs",
]

[tool.scripts]
build-frontend = "cd frontend && pnpm install && pnpm run build"
